{% extends "layout.html" %}

{% block title %}
    Πίνακας Ελέγχου
{% endblock %}

{% block body %}
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="{{ url_for('add_doctor') }}" class="btn btn-primary">Πρόσθεσε Ιατρό</a>
        <div>
            <a href="{{ url_for('change_password') }}" class="btn btn-secondary btn-sm">Αλλαγή Κωδικού</a>
            <a href="{{ url_for('logout') }}" class="btn btn-secondary btn-sm">Αποσύνδεση</a>
        </div>
    </div>

    <ul class="list-group">
        {% for doctor in doctors %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ doctor.name }}
                <div>
                    <a href="{{ url_for('edit_doctor', id=doctor.id) }}" class="btn btn-secondary btn-sm">Επεξεργασία</a>
                    <a href="{{ url_for('delete_doctor', id=doctor.id) }}" class="btn btn-danger btn-sm">Διαγραφή</a>
                </div>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
