{% extends "layout.html" %}

{% block title %}
    Στοιχεία Ιατρού
{% endblock %}

{% block body %}
    <div class="col-12 col-md-8 col-lg-6 mx-auto">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 text-center mb-4">{{ "Επεξεργασία Ιατρού" if doctor_id else "Προσθήκη Ιατρού" }}</h1>
                <form action="{{ url_for('edit_doctor', doctor_id=doctor_id) if doctor_id else url_for('add_doctor') }}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="name" class="form-label">Ονοματεπώνυμο</label>
                        <input name="name" id="name" type="text" class="form-control" placeholder="π.χ. Γιώργος Παπαδόπουλος" value="{{ values.name if values else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">Ειδικότητα</label>
                        <input name="role" id="role" type="text" class="form-control" placeholder="π.χ. Καρδιολόγος" value="{{ values.role if values else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="bio" class="form-label">Σύντομο βιογραφικό</label>
                        <textarea name="bio" id="bio" class="form-control" rows="4">{{ values.bio if values else '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input name="email" id="email" type="email" class="form-control" placeholder="π.χ. doctor@example.com" value="{{ values.email if values else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Τηλέφωνο</label>
                        <input name="phone" id="phone" type="tel" class="form-control" placeholder="π.χ. 99123456 ή 22123456" pattern="[29][0-9]{7}" title="8 ψηφία, ξεκινώντας με 2 ή 9" value="{{ values.phone if values else '' }}">
                    </div>
                    <div class="mb-3">
                        <img id="photo-preview" class="d-none img-fluid" alt="">
                    </div>
                    <div class="mb-3">
                        <label for="photo" class="form-label">Φωτογραφία</label>
                        <input name="photo" id="photo" type="file" class="form-control photo-input" accept=".jpg, .jpeg, .png, .webp">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">{{ "Αποθήκευση" if doctor_id else "Προσθήκη" }}</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
