{% extends "layout.html" %}

{% block title %}
    Επιβεβαίωση Διαγραφής
{% endblock %}

{% block body %}
    <div class="col-12 col-md-6 col-lg-4 mx-auto">
        <div class="card shadow-sm border-danger-subtle">
            <div class="card-body p-4 text-center">
                <h1 class="h4 mb-3">Επιβεβαίωση Διαγραφής</h1>
                <p class="mb-4">Θέλετε σίγουρα να διαγράψετε τον/την Δρ. {{ doctor.name }};</p>
                <div class="d-flex gap-2 justify-content-center">
                    <form action="{{ url_for('delete_doctor', doctor_id=doctor.id) }}" method="post">
                        <button type="submit" class="btn btn-danger">Διαγραφή</button>
                    </form>
                    <a href="{{ url_for('admin') }}" class="btn btn-secondary">Ακύρωση</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
