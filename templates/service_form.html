{% extends "layout.html" %}

{% block title %}
    Υπηρεσία
{% endblock %}

{% block body %}
    <div class="col-12 col-md-8 col-lg-6 mx-auto">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 text-center mb-4">{{ "Επεξεργασία Υπηρεσίας" if service_id else "Προσθήκη Υπηρεσίας" }}</h1>
                <form action="{{ url_for('edit_service', service_id=service_id) if service_id else url_for('add_service') }}" method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label">Όνομα Υπηρεσίας</label>
                        <input name="name" id="name" type="text" class="form-control" placeholder="π.χ. Αιμοδοσία" value="{{ values.name if values else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="details" class="form-label">Λεπτομέρειες</label>
                        <textarea name="details" id="details" class="form-control" rows="3" placeholder="π.χ. Διαθέσιμο μόνο τις Δευτέρες">{{ values.details if values else '' }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">{{ "Αποθήκευση" if service_id else "Προσθήκη" }}</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
