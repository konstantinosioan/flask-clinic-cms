{% extends "layout.html" %}

{% block title %}
    Στοιχεία Φωτογραφίας
{% endblock %}

{% block body %}
    <div class="col-12 col-md-6 mx-auto">
        <form action="{{ url_for('edit_gallery_item', id=gallery_id) if gallery_id else url_for('add_gallery_item') }}" method="post">
            <div class="mb-3">
                <label for="caption" class="form-label">Λεζάντα</label>
                <textarea name="caption" class="form-control" rows="3" placeholder="π.χ. Η αίθουσα αναμονής μας">{{ values.caption if values else '' }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">{{ "Αποθήκευση" if gallery_id else "Προσθήκη" }}</button>
        </form>
    </div>
{% endblock %}
