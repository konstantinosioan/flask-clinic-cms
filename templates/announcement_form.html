{% extends "layout.html" %}

{% block title %}
    Ανακοίνωση
{% endblock %}

{% block body %}
    <div class="col-12 col-md-8 col-lg-6 mx-auto">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 text-center mb-4">{{ "Επεξεργασία Ανακοίνωσης" if announcement_id else "Προσθήκη Ανακοίνωσης" }}</h1>
                <form action="{{ url_for('edit_announcement', announcement_id=announcement_id) if announcement_id else url_for('add_announcement') }}" method="post">
                    <div class="mb-3">
                        <label for="title" class="form-label">Τίτλος</label>
                        <input name="title" id="title" type="text" class="form-control" placeholder="π.χ. Αλλαγή Ωραρίου" value="{{ values.title if values else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="body" class="form-label">Κείμενο</label>
                        <textarea name="body" id="body" class="form-control" rows="4">{{ values.body if values else '' }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">{{ "Αποθήκευση" if announcement_id else "Προσθήκη" }}</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
