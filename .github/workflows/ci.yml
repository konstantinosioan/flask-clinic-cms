name: Continuous Integration

on: push

jobs:
    test:
        name: Run tests and linters
        runs-on: ubuntu-latest
        permissions:
            contents: read
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"
                  cache: "pip"
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt

            - name: Install dependencies
              id: install
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements-dev.txt

            - name: Run tests
              run: pytest

            - name: Check formatting with black
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: black --check .

            - name: Lint with pylint
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: pylint app.py helpers.py --fail-under=9.0

            - name: Lint the Dockerfile
              if: '!cancelled()'
              uses: hadolint/hadolint-action@v3.4.0
              with:
                  dockerfile: Dockerfile
                  failure-threshold: warning

            - name: Build Docker image
              id: docker-build
              if: '!cancelled()'
              run: docker build -t clinic-cms .

            - name: Smoke test the image
              if: ${{ !cancelled() && steps.docker-build.outcome == 'success' }}
              run: |
                  docker run -d --name smoke -p 8000:8000 clinic-cms
                  for i in {1..10}; do
                      curl -fsS http://localhost:8000/robots.txt && exit 0
                      sleep 2
                  done
                  docker logs smoke
                  exit 1
