{% extends "layout.html" %}

{% block title %}
    Στοιχεία Φωτογραφίας
{% endblock %}

{% block body %}
    <div class="col-12 col-md-8 col-lg-6 mx-auto">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 text-center mb-4">{{ "Επεξεργασία Φωτογραφίας" if gallery_id else "Προσθήκη Φωτογραφίας" }}</h1>
                <form action="{{ url_for('edit_gallery_item', gallery_id=gallery_id) if gallery_id else url_for('add_gallery_item') }}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="caption" class="form-label">Λεζάντα</label>
                        <textarea name="caption" id="caption" class="form-control" rows="3" placeholder="π.χ. Η αίθουσα αναμονής μας">{{ values.caption if values else '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <img id="image-preview" class="d-none img-fluid" alt="">
                    </div>
                    <div class="mb-3">
                        <label for="image" class="form-label">Φωτογραφία</label>
                        <input name="image" id="image" type="file" class="form-control photo-input" accept=".jpg, .jpeg, .png, .webp, .heic, .heif">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">{{ "Αποθήκευση" if gallery_id else "Προσθήκη" }}</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
